syntax = "proto3";

package kut.v1;

option go_package = "kut.corp/suite/gen/kut/v1;kutv1";

// Cihazın yaşam döngüsü durumu. DB'deki device_status ENUM'u ile birebir eşleşir.
enum DeviceStatus {
  DEVICE_STATUS_UNSPECIFIED = 0;
  DEVICE_STATUS_PENDING_ENROLLMENT = 1; // Kayıt token'ı üretildi, henüz sertifika almadı.
  DEVICE_STATUS_ACTIVE = 2;
  DEVICE_STATUS_OFFLINE = 3;
  DEVICE_STATUS_QUARANTINED = 4;
  DEVICE_STATUS_UNINSTALLED = 5;
}

// Olay kategorisi. DB'deki event_category ENUM'u ile eşleşir.
enum EventCategory {
  EVENT_CATEGORY_UNSPECIFIED = 0;
  EVENT_CATEGORY_SYSTEM = 1;
  EVENT_CATEGORY_SECURITY = 2;
  EVENT_CATEGORY_NETWORK_DISCOVERY = 3;
  EVENT_CATEGORY_POLICY_VIOLATION = 4;
  EVENT_CATEGORY_AGENT_UPDATE = 5;
  EVENT_CATEGORY_PROCESS = 6;
  EVENT_CATEGORY_NETWORK_CONN = 7;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_LOW = 2;
  SEVERITY_MEDIUM = 3;
  SEVERITY_HIGH = 4;
  SEVERITY_CRITICAL = 5;
}

// Ajanı tanımlayan, sertifika CN'ine bağlı kimlik. Sunucu bu değeri istemci
// sertifikasından (mTLS) alır; istemcinin gövdede gönderdiği değere GÜVENMEZ.
message AgentIdentity {
  string device_id = 1;      // UUID
  string agent_version = 2;
  string os_platform = 3;    // "windows", "linux"
  string os_version = 4;     // okunabilir OS sürümü (ör. "Windows 10 22H2", "Ubuntu 22.04")

  // 5: W2-S7 (OTA manifest v2) için ayrıldı — os_arch (işletim sistemi/mimari).
  reserved 5;
}

// KeyRole, güven bildirimindeki bir anahtarın rolüdür (W2 komut dokusu).
enum KeyRole {
  KEY_ROLE_UNSPECIFIED = 0;
  KEY_ROLE_ROOT = 1;    // Yalnız güven bildirimi imzalar; çevrimdışı tutulur.
  KEY_ROLE_COMMAND = 2; // Yalnız komut zarfı imzalar; not_after_ns ZORUNLU.
}

// KeyEntry, güven bildirimindeki tek anahtardır. key_id = hex(sha256(pubkey)[:16]).
message KeyEntry {
  string key_id = 1;
  bytes pubkey = 2;          // Ed25519, 32 bayt.
  KeyRole role = 3;
  int64 not_before_ns = 4;   // UnixNano; 0 = sınırsız.
  int64 not_after_ns = 5;    // UnixNano; 0 = süresiz (yalnız ROOT için geçerli).
}

// TrustSignature, bir ROOT anahtarın bildirim imzasıdır.
message TrustSignature {
  string key_id = 1;
  bytes signature = 2;
}

// TrustStatement, ajanın hangi anahtarlara güveneceğini söyleyen imzalı bildirimdir.
// Kanonik imza baytları ve kabul kuralları cmdenvelope/trust.go + docs/COMMAND-FABRIC.md.
message TrustStatement {
  uint64 epoch = 1;
  repeated KeyEntry keys = 2;
  uint32 root_threshold = 3;
  int64 issued_at_ns = 4;
  uint32 min_verify_mode = 5;   // 0 none, 1 warn, 2 enforce (yalnız yukarı ratchet).
  uint64 min_agent_build = 6;
  repeated TrustSignature signatures = 7;
}

// TenantBinding, cihazın hangi kiracıya ait olduğunu bildirir (ajan sabitler).
message TenantBinding {
  string tenant_id = 1;
}
