syntax = "proto3";

package kut.v1;

option go_package = "kut.corp/suite/gen/kut/v1;kutv1";

// Cihazın yaşam döngüsü durumu. DB'deki device_status ENUM'u ile birebir eşleşir.
enum DeviceStatus {
  DEVICE_STATUS_UNSPECIFIED = 0;
  DEVICE_STATUS_PENDING_ENROLLMENT = 1; // Kayıt token'ı üretildi, henüz sertifika almadı.
  DEVICE_STATUS_ACTIVE = 2;
  DEVICE_STATUS_OFFLINE = 3;
  DEVICE_STATUS_QUARANTINED = 4;
  DEVICE_STATUS_UNINSTALLED = 5;
}

// Olay kategorisi. DB'deki event_category ENUM'u ile eşleşir.
enum EventCategory {
  EVENT_CATEGORY_UNSPECIFIED = 0;
  EVENT_CATEGORY_SYSTEM = 1;
  EVENT_CATEGORY_SECURITY = 2;
  EVENT_CATEGORY_NETWORK_DISCOVERY = 3;
  EVENT_CATEGORY_POLICY_VIOLATION = 4;
  EVENT_CATEGORY_AGENT_UPDATE = 5;
  EVENT_CATEGORY_PROCESS = 6;
  EVENT_CATEGORY_NETWORK_CONN = 7;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_LOW = 2;
  SEVERITY_MEDIUM = 3;
  SEVERITY_HIGH = 4;
  SEVERITY_CRITICAL = 5;
}

// Ajanı tanımlayan, sertifika CN'ine bağlı kimlik. Sunucu bu değeri istemci
// sertifikasından (mTLS) alır; istemcinin gövdede gönderdiği değere GÜVENMEZ.
message AgentIdentity {
  string device_id = 1;      // UUID
  string agent_version = 2;
  string os_platform = 3;    // "windows", "linux"
  string os_version = 4;     // okunabilir OS sürümü (ör. "Windows 10 22H2", "Ubuntu 22.04")

  // 5: OTA manifest v2 için ayrıldı — os_arch (işletim sistemi/mimari).
  reserved 5;
}

// DsseEnvelope, DSSE (Dead Simple Signing Envelope) zarfıdır. Komut zarfı v2 ve güven
// bildirimi bununla taşınır (docs/COMMAND-FABRIC.md):
//   * payload_type: "application/vnd.kut.cmd.v2" (komut) ya da "application/vnd.kut.trust.v2"
//     (güven bildirimi). Sürüm yük türünde taşınır.
//   * payload: kanonik gövde baytları (tüm imzacılar için aynı).
//   * signatures: her biri Ed25519(PAE(payload_type, payload)); keyid doğrulanmamış ipucudur.
// JSON eşlemesi standart DSSE alan adlarıyla uyumludur (payloadType, payload, signatures[keyid, sig]).
message DsseEnvelope {
  string payload_type = 1;
  bytes payload = 2;
  repeated DsseSignature signatures = 3; // en çok 8
}

// DsseSignature, DSSE zarfındaki tek imza girdisidir.
message DsseSignature {
  string keyid = 1; // hex(sha256(pubkey)[:16]); doğrulanmamış ipucu
  bytes sig = 2;    // Ed25519, 64 bayt
}

// TenantBinding, cihazın hangi kiracıya ait olduğunu bildirir (ajan sabitler).
message TenantBinding {
  string tenant_id = 1;
}
