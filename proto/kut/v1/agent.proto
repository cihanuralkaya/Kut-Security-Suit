syntax = "proto3";

package kut.v1;

option go_package = "kut.corp/suite/gen/kut/v1;kutv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "kut/v1/common.proto";

// AgentService, kayıtlı bir ajanın C2 ile tüm rutin iletişimidir.
// TAMAMI mTLS üzerinden çalışır: sunucu, ajanın kimliğini istemci
// sertifikasından doğrular ve gövdedeki device_id'ye körü körüne güvenmez.
service AgentService {
  // Periyodik yaşam sinyali. Yanıt SUNUCU SAATİNİ taşır; ajan, mesai-saati
  // politikalarını değerlendirirken yerel saate değil bu çıpaya dayanır
  // (yerel saat manipülasyonuna karşı koruma).
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Politika akışı. Sunucu, politika değiştiğinde ajana yeni sürümü iter.
  // Ajan mevcut policy_version'ını bildirir; sunucu yalnızca değişiklikte gönderir.
  rpc StreamPolicies(PolicySubscribeRequest) returns (stream PolicyBundle);

  // Olay/log gönderimi. Ajan, çevrimdışıyken tamponladığı olayları
  // (store-and-forward) toplu olarak gönderir. Sunucu en son kabul edilen
  // sequence numarasını döner; ajan yalnızca onaylananları tamponundan siler.
  rpc ReportEvents(stream EventBatch) returns (EventAck);

  // OTA güncelleme kontrolü. Yanıt yalnızca metadata + İMZA taşır; ikili paket
  // ayrı, imzalı bir kanaldan indirilir ve ajan İMZAYI doğrular (yalnız hash yetmez).
  rpc CheckUpdate(UpdateCheckRequest) returns (UpdateManifest);

  // Adli/IR dosya toplama: COLLECT_FILE komutu üzerine ajan hedef dosyayı
  // (boyut-sınırlı) okuyup içeriğini yükler. Kimlik istemci sertifikasından.
  rpc UploadArtifact(UploadArtifactRequest) returns (UploadArtifactResponse);
}

// UploadArtifactRequest, ajanın topladığı bir dosyayı taşır (boyut-sınırlı).
message UploadArtifactRequest {
  string command_id = 1;  // toplamayı tetikleyen komut
  string path = 2;        // kaynaktaki dosya yolu
  string sha256 = 3;      // içeriğin SHA-256'sı (hex)
  bytes content = 4;      // dosya içeriği (sunucu boyut sınırını uygular)
}

message UploadArtifactResponse {
  bool ok = 1;
}

message HeartbeatRequest {
  AgentIdentity identity = 1;
  string current_policy_version = 2;
  DeviceStatus self_reported_status = 3;
  ResourceMetrics metrics = 4; // Lokal ML/baseline için hafif metrikler.
  // binary_hash, ajanın kendi çalışan ikilisinin SHA-256'sıdır (öz-tasdik / tedarik
  // zinciri bütünlüğü, #4). Sürüm değişmeden hash değişirse takas/yamalanmış ikili
  // (olası kurcalama) sinyali. Boş = ajan öz-tasdiki bildirmiyor.
  string binary_hash = 5;
  // acked_command_ids, ajanın YÜRÜTMEYİ tamamladığı komutların kimlikleridir
  // (en-az-bir-kez teslim onayı). Sunucu bunları acked olarak işaretler; onaylanmayan
  // komutlar kira süresi sonunda yeniden teslim edilir (ajan çökse de kaybolmaz).
  repeated string acked_command_ids = 6;
  // command_results, ajanın komutları YÜRÜTME SONUCUDUR (SUCCEEDED/FAILED) — ACK'ten
  // (yalnız teslim/alındı) FARKLI. Sunucu bunu effective-state geçişi için kullanır
  // (ör. QUARANTINE SUCCEEDED → cihaz gerçekten izole; desired≠effective ayrımı, F-D).
  repeated CommandResult command_results = 7;
  // W2 komut dokusu: ajanın kabul ettiği güven bildirimi epoch'u (0 = güven edinilmedi),
  // desteklediği yetenekler ve derleme numarası. Eski sunucu yok sayar.
  uint64 trust_epoch = 8;
  repeated string capabilities = 9;
  uint64 agent_build = 10;
}

message HeartbeatResponse {
  // Sunucu saati — politika zaman pencerelerinin güvenilir çıpası.
  google.protobuf.Timestamp server_time = 1;
  bool policy_update_available = 2;
  bool update_available = 3;
  // Sunucudan ajana anlık komut (örn. karantinaya al, karantinadan çıkar).
  repeated Command pending_commands = 4;
  // W2: ajanın epoch'undan sonraki güven bildirimleri (artan sırada). Ajan bunları bu
  // yanıtın komutlarını doğrulamadan ÖNCE uygular.
  repeated TrustStatement trust_statements = 5;
  // Yalnız bootstrap yanıtında (sunucu opt-in): cihazın kiracı bağı.
  TenantBinding tenant_binding = 6;
}

message ResourceMetrics {
  double cpu_percent = 1;
  double mem_percent = 2;
  uint32 active_connections = 3;
}

message Command {
  string command_id = 1;
  CommandType type = 2;
  google.protobuf.Struct params = 3;

  // CommandEnvelope güvenlik alanları (CONTRACTS §5). Komut düzlemi (commandplane)
  // tarafından üretilir; ajan bunları doğrulayabilir (imza + tazelik + anti-replay).
  // Geriye-uyumlu (yeni alan no'ları 4-8): eski ajan yok sayar, yeni sunucu eski
  // komutlarda boş bırakır — bağımsız dağıtım (additive proto migrasyonu).
  bytes signature = 4;          // Ed25519 imza (non-repudiation + bütünlük)
  string nonce = 5;             // replay-tazelik (tek-kullanım)
  int64 issued_at_unix = 6;     // imzalama anı (UnixNano)
  int64 expires_at_unix = 7;    // zarf geçerlilik sonu (UnixNano)
  string issued_by = 8;         // imzalayan/talep eden kimlik (audit)

  // Zarf v2 (W2, docs/COMMAND-FABRIC.md). v2'de 4-8 şöyle okunur: signature = birincil
  // Ed25519 imzası, nonce = 32 küçük harfli hex, issued_at_unix/expires_at_unix =
  // UnixNano, issued_by = requested_by (imzalı). cihaz kimliği TELDE YOKTUR: ajan
  // kendi sertifika CN'ini (küçük harf) imza girdisine koyar.
  string tenant_id = 9;             // sunucuda cihaz satırından çözülür; "" = platform
  uint32 envelope_version = 10;     // 0 = zarfsız, 2 = v2; diğer değerler reddedilir
  string key_id = 11;               // birincil imza anahtarı: hex(sha256(pub)[:16])
  string correlation_id = 12;       // opak istek kimliği (imzalı)
  uint64 sequence = 13;             // cihaz başına monoton (imzalı)
  string approved_by = 14;          // çift-kontrol onaylayanı (imzalı); "" = yok
  repeated CommandSignature extra_signatures = 15; // aynı ileti, kendi key_id'siyle

  enum CommandType {
    COMMAND_TYPE_UNSPECIFIED = 0;
    COMMAND_TYPE_QUARANTINE = 1;    // Ağ izolasyonu uygula.
    COMMAND_TYPE_UNQUARANTINE = 2;
    COMMAND_TYPE_RUN_SIGNED_SCRIPT = 3; // İmzalı script çalıştır (sandbox'ta).
    COMMAND_TYPE_UNINSTALL = 4;     // Yalnız imzalı/OTP doğrulanmış kaldırma.
    COMMAND_TYPE_COLLECT_DIAGNOSTICS = 5;
    COMMAND_TYPE_COLLECT_FILE = 6;  // Adli dosya toplama (params.path).
    COMMAND_TYPE_LOCK = 7;          // Uzaktan ekran kilitleme (MDM).
    COMMAND_TYPE_RESTART = 8;       // Uzaktan yeniden başlatma (MDM).
    COMMAND_TYPE_WIPE = 9;          // Uzaktan veri silme (MDM; ADMIN + audit).
  }
}

// CommandSignature, zarfın ek imzasıdır (rotasyon örtüşmesi ve ileride 2-of-N sınıfı).
// Her imza aynı iletiyi KENDİ key_id'si yerleştirilerek imzalar.
message CommandSignature {
  string key_id = 1;
  bytes signature = 2;
}

// CommandStatus, bir komutun YÜRÜTME sonucudur (ACK/alındı DEĞİL — gerçek sonuç).
enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_SUCCEEDED = 1; // komut cihazda başarıyla uygulandı (effective)
  COMMAND_STATUS_FAILED = 2;    // komut uygulanamadı
}

// CommandResult, tek bir komutun yürütme sonucudur. Ajan heartbeat'te bildirir;
// sunucu desired→effective durum geçişini (ör. QUARANTINE_PENDING→QUARANTINED) buna
// göre yapar. ACK (teslim) ile SUCCESS (uygulandı) burada ayrışır.
message CommandResult {
  string command_id = 1;
  CommandStatus status = 2;
  string detail = 3; // opsiyonel hata/bağlam
  // command_type, sonucun HANGİ komut tipine ait olduğudur. Sonucu self-describing
  // yapar: sunucu effective-state kararını (ör. QUARANTINE SUCCEEDED → QUARANTINED)
  // komut-geçmişi araması yapmadan verir.
  Command.CommandType command_type = 4;
  // envelope_digest = sha256(imzalanan ileti): sunucu yürütülen komutu verilen zarfla
  // ilişkilendirir. Zarfsız (eski) komutlarda boş.
  bytes envelope_digest = 5;
}

message PolicySubscribeRequest {
  AgentIdentity identity = 1;
  string current_policy_version = 2;
}

// Ajana itilen tam politika paketi. Sürümlüdür; ajan diske şifreli yazar.
message PolicyBundle {
  string policy_version = 1;
  repeated PolicyRule rules = 2;
  google.protobuf.Timestamp issued_at = 3;
  bytes signature = 4; // Sunucunun imzası; ajan içeriği doğrular.

  // 5-11: W2-S9b (politika imzası: content_sig, assignment_sig, key_id, revision,
  // assign_seq, authored_at_ns, assigned_at_ns) için ayrıldı.
  reserved 5 to 11;
}

// Tek bir kural. DB'deki policy_rules ile eşleşir.
message PolicyRule {
  string rule_id = 1;
  RuleType type = 2;
  string target_value = 3;      // Örn. yasaklı uygulama adı / path / hash.
  string start_time = 4;        // "HH:MM" (sunucu saat diliminde).
  string end_time = 5;          // "HH:MM"
  repeated uint32 active_days = 6; // 0=Pazar ... 6=Cumartesi.

  enum RuleType {
    RULE_TYPE_UNSPECIFIED = 0;
    RULE_TYPE_APP_TIME_BLOCK = 1;   // Mesai dışı uygulama yasağı.
    RULE_TYPE_APP_BLOCK_ALWAYS = 2;
    RULE_TYPE_NETWORK_RULE = 3;
  }
}

message EventBatch {
  AgentIdentity identity = 1;
  repeated Event events = 2;
}

message Event {
  uint64 sequence = 1;          // Ajan-lokal monoton sıra no (ack için).
  EventCategory category = 2;
  Severity severity = 3;
  string message = 4;
  google.protobuf.Struct details = 5;
  google.protobuf.Timestamp occurred_at = 6; // Ajanın gözlemlediği an.
}

message EventAck {
  uint64 last_accepted_sequence = 1; // Ajan bu no'ya kadar olanları silebilir.
}

message UpdateCheckRequest {
  AgentIdentity identity = 1;
}

// OTA güncelleme manifestosu. Ajan, ikiliyi indirdikten SONRA bu imzayı
// public key ile doğrular; yalnız SHA-256 eşleşmesi yeterli DEĞİLDİR.
message UpdateManifest {
  bool update_available = 1;
  string target_version = 2;
  string download_url = 3;
  string sha256_hex = 4;       // Bütünlük (transport hatası tespiti).
  bytes signature = 5;         // Kimlik+bütünlük: Ed25519/Authenticode imzası.
  bool mandatory = 6;
  uint32 rollout_percent = 7;  // Kademeli dağıtım (canary).

  // 8-12: W2-S7 (OTA manifest v2: build_number, os, arch, not_after_unix,
  // manifest_version) için ayrıldı.
  reserved 8 to 12;
}
