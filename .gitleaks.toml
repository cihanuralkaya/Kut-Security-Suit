# gitleaks yapılandırması — kaynak kodda sızmış kimlik-bilgisi/anahtar taraması.
# Varsayılan kural kümesi genişletilir; yalnızca geliştirme/demo yapıtları
# (üretim sırrı olmayan; PKI/agent-data/çıktı dizinleri) allowlist'e alınır.
[extend]
useDefault = true

[allowlist]
description = "Demo/geliştirme yapıtları — üretim sırrı değildir (yerel çalıştırma çıktısı)"
paths = [
  '''_demo[\\/].*''',
]
# AWS dokümantasyonundaki herkese açık ÖRNEK anahtar (gerçek kimlik bilgisi
# değildir); DLP/secret-broker testlerinde sahte girdi olarak kullanılır.
# Yalnızca bu tam dize allowlist'e alınır — başka hiçbir AKIA... eşleşmesi değil.
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
]
